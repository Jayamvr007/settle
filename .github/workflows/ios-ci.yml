# Settle iOS CI/CD Pipeline
# Runs on: Push to main, Pull Requests
# Tools: Fastlane + GitHub Actions

name: iOS CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  DEVELOPER_DIR: /Applications/Xcode.app/Contents/Developer

jobs:
  # ═══════════════════════════════════════════════════════════════
  # JOB 1: Build and Test
  # ═══════════════════════════════════════════════════════════════
  build-and-test:
    name: Build & Test
    runs-on: macos-14
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Cache Ruby gems (Fastlane)
        uses: actions/cache@v4
        with:
          path: vendor/bundle
          key: ${{ runner.os }}-gems-${{ hashFiles('**/Gemfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-gems-

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      - name: Run Tests
        run: |
          xcodebuild test \
            -workspace Settle.xcworkspace \
            -scheme Settle \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15,OS=latest' \
            -resultBundlePath TestResults \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Test Results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: TestResults

  # ═══════════════════════════════════════════════════════════════
  # JOB 2: Build IPA (on main branch only)
  # ═══════════════════════════════════════════════════════════════
  build-ipa:
    name: Build IPA
    runs-on: macos-14
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('**/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Build Archive
        run: |
          xcodebuild archive \
            -workspace Settle.xcworkspace \
            -scheme Settle \
            -sdk iphoneos \
            -archivePath $PWD/build/Settle.xcarchive \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty --color

      - name: Upload Archive
        uses: actions/upload-artifact@v4
        with:
          name: settle-archive
          path: build/Settle.xcarchive

  # ═══════════════════════════════════════════════════════════════
  # JOB 3: Deploy to TestFlight (manual trigger)
  # ═══════════════════════════════════════════════════════════════
  deploy-testflight:
    name: Deploy to TestFlight
    runs-on: macos-14
    needs: build-ipa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Change to: if: github.event_name == 'workflow_dispatch' for manual only
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install CocoaPods dependencies
        run: pod install --repo-update

      - name: Install Ruby dependencies
        run: |
          bundle config path vendor/bundle
          bundle install --jobs 4 --retry 3

      # Uncomment when ready to deploy
      # - name: Deploy to TestFlight
